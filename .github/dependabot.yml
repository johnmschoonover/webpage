version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/site"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    open-pull-requests-limit: 5
    ignore:
      # TS 7 (native compiler) has no stable programmatic API yet; astro check
      # (Volar) crashes on it. Revisit once Astro language-tools support TS 7.1+.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
